<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#6366f1" id="themeColorMeta" />
  <meta name="description" content="Kokonäytön loader – asennettava web-sovellus." />

  <title>Loader</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Loader" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Loaderi keskellä koko näytön -->
  <main class="stage" id="stage" aria-label="Loader">
    <div class="loader" id="loader"></div>
  </main>

  <!-- Asetusnappi yläoikealla -->
  <button class="settings-btn" id="settingsBtn" aria-label="Asetukset" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <!-- Asetuspaneeli -->
  <div class="overlay" id="overlay" hidden></div>

  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Asetukset" hidden>
    <header class="panel-head">
      <h2>Asetukset</h2>
      <button class="close-btn" id="closeBtn" aria-label="Sulje">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <section class="setting-group">
      <h3>Teema</h3>
      <div class="theme-toggle" role="group" aria-label="Teeman valinta">
        <button class="theme-opt" data-theme="light">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>
          </svg>
          Vaalea
        </button>
        <button class="theme-opt" data-theme="dark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          Tumma
        </button>
      </div>
    </section>

    <section class="setting-group">
      <h3>Loader</h3>
      <div class="loader-grid" id="loaderGrid"><!-- täytetään JS:llä --></div>
    </section>

    <section class="setting-group">
      <h3>Koko</h3>
      <div class="size-row">
        <input type="range" class="size-slider" id="sizeSlider"
               min="0.8" max="3" step="0.1" value="1.7"
               aria-label="Loaderin koko" />
        <span class="size-value" id="sizeValue">170 %</span>
      </div>
    </section>

    <section class="setting-group">
      <h3>Korostusväri</h3>
      <div class="color-row" id="colorRow"><!-- täytetään JS:llä --></div>
    </section>

    <p class="hint">Asetukset tallentuvat automaattisesti tälle laitteelle.</p>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
